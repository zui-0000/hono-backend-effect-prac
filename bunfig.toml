# bun のランタイム設定。いまはテストのカバレッジまわりだけを置く。
#
# テストの実行対象そのものは package.json の scripts が決める
# (test = presentation を除いた全部 / test:api = presentation のみ)。
# ここは「数えるとき何を分母にするか」だけを担当する。

[test]
# テスト自身を分母から外す。テストファイルは必ず 100% になるので、
# 入れると全体の数字が実際より良く見える。
coverageSkipTestFiles = true

# 分母から外すもの。**どちらも「人が書いていないコード」**という基準で選んでいる。
coveragePathIgnorePatterns = [
  # orval が OpenAPI から生成する Effect Schema。gitignore 済みでレビューもしない。
  "src/generated/**",
  # テストを動かすための偽の実装と固定値。テスト側の資材なので数える対象ではない。
  "src/__mocks__/**",
]

# `coverage = false` は**書かないこと**。
#
# 既定でカバレッジが出ないのは変わらないが、これを書くと **CLI の --coverage まで
# 打ち消される**。`bun test --coverage` を叩いても表が 1 行も出ず、しかもエラーにも
# ならないので「カバレッジが出ないツール」ができあがる。実際に書いて踏んだ
# (bunfig 有無で分母のファイル数が 0 対 53 になることで切り分けた)。
#
# 閾値 (coverageThreshold) も**まだ入れない**。
# bun のカバレッジは「一度も import されなかったファイル」を表に載せない。
# つまり未テストのモジュールは 0% ではなく**存在しないことになる**ので、
# いまの状態で閾値を置いても守るものが無い (実際、HTTP 境界のテストしか無かった
# 時点では auth コンテキストのファイルが 1 つも表に出てこなかった)。
# 単体テストが各層に行き渡って分母が安定してから、そのとき決める。
